name: Detailed model evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments_detailed.py"
      - "src/**"
      - ".github/workflows/detailed-evaluation.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run detailed evaluation
        run: python experiments_detailed.py
      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: detailed-model-evaluation
          path: |
            results/detailed_evaluation.md
            results/detailed_evaluation.json
